<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Kino XII</title>
</head>
<body>
    <main>
        <section>
            <div>
                <h1>Log in</h1>
                <button type="button" aria-label="Close">x</button>
            </div>
            <p>Welcome back to Kino XII</p>
            <form>
                <div>
                    <label for="email">Email</label>
                    <input 
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        placeholder="********"
                        required>
                </div>
                <button type="submit">
                    Log In
                </button>
            </form>
            <p>
                Don't have an account?
                <a href="signup.html">Sign up</a>
            </p>
        </section>
    </main>
</body>
</html>
