<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log in - Kino XII</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- =========================
         Login Overlay
         ========================= -->

    <div class="login-overlay">

        <!-- =========================
             Login Modal
             ========================= -->

        <section
            class="login-modal"
            aria-labelledby="login-title"
        >

            <!-- Header -->

            <header>
                <h1 id="login-title">Log in</h1>

                <button
                    type="button"
                    aria-label="Close login"
                >
                    ×
                </button>
            </header>


            <!-- Welcome message -->

            <p>
                Welcome back to Kino XII
            </p>


            <!-- Login form -->

            <form>

                <!-- Email -->

                <div>
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >
                </div>


                <!-- Password -->

                <div>
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <!-- Submit -->

                <button type="submit">
                    Log in
                </button>

            </form>


            <!-- Sign up -->

            <p>
                Don't have an account?
                <a href="signup.html">
                    Sign up
                </a>
            </p>

        </section>

    </div>

</body>

</html>
