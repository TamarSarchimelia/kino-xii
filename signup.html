<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Kino XII</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="signup-overlay">
        <section class="signup-modal">
            <header>
                <h1>Sign up</h1>
                <button type="button" aria-label="close">x</button>
            </header>
            <p>Welcome to Kino XII</p>
            <div class="avatar-upload">
                <label for="avatar">
                    <span class="upload-icon">⇧</span>
                    <span>
                        <strong>Upload avatar (optional)</strong>
                        <small>JPG, PNG or WEBP</small>
                    </span>
                </label>
                <input type="file" id="avatar" name="avatar" accept=".jpg, .jpeg, .png, .webp">
            </div>
           <form>
                <div class="form-group">
                    <label for="username">username</label>
                    <input type="text" id="username" name="username" placeholder="User" required>

                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

                </div>
                <div class="password-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>

                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>

                    </div>
                </div>
                <button type="submit">Sign up</button>
           </form>
           <p class="login-link">
            Already have an account?
            <a href="login.html">Log in</a>
           </p>
        </section>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
